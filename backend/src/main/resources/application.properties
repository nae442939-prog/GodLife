spring.application.name=backend
server.port=8080

# 로컬 비밀값은 backend/.env 에서 읽는다 (커밋 금지, 키 목록은 .env.example)
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:godlife}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:godlife_user}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 db/ 의 SQL 스크립트로 관리한다. JPA 가 테이블을 만들거나 바꾸지 않게 막는다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# AI 서버 (직접 파인튜닝한 모델을 서빙하는 FastAPI)
ai-server.base-url=${AI_SERVER_URL:http://localhost:8000}
# false 면 AI 서버를 부르지 않고 인증을 바로 받는다. (서버가 꺼져 있거나 모델이 없을 때도 알아서 건너뛴다)
ai-server.enabled=${AI_SERVER_ENABLED:true}

# 결제 (포인트 충전, 토스페이먼츠). 테스트 모드로만 연동한다: test_ 로 시작하는 키만 받는다.
# 키가 비어 있으면 화면에서 결제 버튼이 꺼진다. 실제 키 값은 backend/.env 에만 둔다.
app.payment.toss.client-key=${TOSS_CLIENT_KEY:}
app.payment.toss.secret-key=${TOSS_SECRET_KEY:}
# 하루에 충전할 수 있는 금액 (1P = 1원)
app.wallet.charge-daily-limit=50000

# JWT (액세스 토큰 서명 키는 JWT_SECRET 환경변수로만 주입한다. 32바이트 이상)
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
jwt.refresh-token-days=14
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}

# 휴대폰 번호 HMAC 키 (번호는 원문 대신 이 키로 만든 해시만 저장한다. 32바이트 이상, 바꾸면 기존 번호와 매칭이 끊긴다)
app.phone-hmac-secret=${PHONE_HMAC_SECRET}

# 인증번호 문자는 포트폴리오용이라 실제로 보내지 않는다(데모 모드): 인증번호를 화면(API 응답)에 돌려준다.
# 같은 IP 에서 10분 동안 인증번호를 받을 수 있는 횟수
app.sms.ip-limit=30

# 비밀번호 찾기 메일. demo = 인증번호를 화면에 돌려준다 / smtp = Gmail 로 실제 발송 (무료, 하루 약 500통)
app.mail.mode=${MAIL_MODE:demo}
# 같은 IP 에서 10분 동안 비밀번호 찾기 메일을 요청할 수 있는 횟수
app.mail.ip-limit=30
# 같은 IP 에서 10분 동안 초대 코드로 챌린지를 조회/참여할 수 있는 횟수 (코드 무작위 대입 방지)
app.invite.ip-limit=30
# 한 사람이 10초 동안 오픈채팅에 보낼 수 있는 메시지 수 (도배 방지)
app.chat.send-limit=5
# 오픈채팅에서 한 참가자에게 신고가 이만큼 쌓이면 방장에게 알린다
app.chat.report-alert-threshold=20

# 채팅 사진: 서버 디스크 폴더(git 에 안 올림)와 크기 제한. 사진은 다시 그려 저장해 위치 등 촬영 정보를 지운다
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 요청자 IP 는 앞단 프록시(개발: Vite, 배포: nginx 등)가 넘긴 X-Forwarded-For 로 판단한다. (IP당 발송 제한용)
server.forward-headers-strategy=native

# JWT 만 쓰므로 Spring Security 가 만드는 기본 사용자(임시 비밀번호)를 만들지 않게 한다.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# 프론트 주소. 소셜 로그인이 끝나면 이 주소로 돌려보낸다. (Vite 프록시를 거치므로 Redirect URI 도 이 주소 기준)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# OAuth2 소셜 로그인 (키는 backend/.env). 콜백은 {프론트}/login/oauth2/code/{google|kakao|naver}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri=${app.frontend-url}/login/oauth2/code/google
# openid 를 빼서 userinfo 엔드포인트(sub, email, email_verified)로 받는다
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${app.frontend-url}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=${app.frontend-url}/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.scope=name,email,nickname
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response
