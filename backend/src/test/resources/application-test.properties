# 테스트는 개발 DB(godlife)가 아니라 별도 DB(godlife_test)를 쓴다.
# 접속 계정/비밀번호는 main 설정과 같이 backend/.env 에서 읽는다.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/godlife_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

# 테스트 전용 가짜 키 (실제 키가 아님)
jwt.secret=test-only-secret-key-for-unit-tests-0123456789
app.phone-hmac-secret=test-only-phone-hmac-key-0123456789abcdef
# 테스트는 모두 같은 IP(127.0.0.1)에서 보내므로 IP 제한을 넉넉히 둔다. (제한 자체는 따로 검증)
app.sms.ip-limit=1000
app.mail.ip-limit=1000
app.invite.ip-limit=1000
# 신고 누적 알림은 테스트에서 3건으로 확인한다
app.chat.report-alert-threshold=3
# 테스트 사진은 빌드 폴더에 (mvn clean 으로 지워짐)
app.upload.dir=target/test-uploads
# 로컬 .env 가 MAIL_MODE=smtp 여도 테스트는 실제 메일을 보내지 않는다.
app.mail.mode=demo

# 테스트는 실제 소셜 제공자에 접속하지 않는다. 설정 검증만 통과하도록 가짜 값을 둔다.
spring.security.oauth2.client.registration.google.client-id=test-google
spring.security.oauth2.client.registration.google.client-secret=test
spring.security.oauth2.client.registration.kakao.client-id=test-kakao
spring.security.oauth2.client.registration.kakao.client-secret=test
spring.security.oauth2.client.registration.naver.client-id=test-naver
spring.security.oauth2.client.registration.naver.client-secret=test
# 자정 진행 관리는 켜질 때 돌지 않게 (테스트가 날짜를 정해 직접 부른다)
app.lifecycle.run-on-startup=false
# 테스트는 AI 서버를 부르지 않는다 (AI 판정 테스트는 가짜 분류기를 끼워 넣는다)
ai-server.enabled=false
