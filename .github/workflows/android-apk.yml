# 안드로이드 APK 를 GitHub 가 대신 빌드한다 (내 PC 에 Android SDK 를 깔지 않아도 된다).
# mobile/ 이 main 에 올라올 때마다, 또는 Actions 화면에서 직접 돌릴 수 있다.
# 결과: Releases 의 'app-latest' 에 godlife.apk 가 올라간다 → 안드로이드 폰에서 받아 설치한다.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  # PR 에서는 빌드 · 테스트만 해서 합치기 전에 깨지는지 본다 (Releases 는 건드리지 않는다)
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: APK 를 실행 결과에 붙이기
        uses: actions/upload-artifact@v4
        with:
          name: godlife-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Releases 의 app-latest 에 올리기
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk godlife.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest \
            --title "갓생살기 안드로이드 앱 (최신 빌드)" \
            --notes "main 의 mobile/ 을 빌드한 APK 입니다. 안드로이드 폰에서 godlife.apk 를 받아 설치하세요."
          gh release upload app-latest godlife.apk --clobber
