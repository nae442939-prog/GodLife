# 폰으로 들어오면 앱 화면(/app/, Flutter 웹 빌드), 컴퓨터로 들어오면 웹사이트(React)를 보여 준다.
# 예외: 주소에 ?web=1 을 붙이면 그 폰에서 1시간 동안 웹사이트를 그대로 본다 (회원가입처럼 웹에만 있는 화면용).
# (/etc/nginx/conf.d/godlife-maps.conf)
map $http_user_agent $gl_mobile {
    default 0;
    "~*(iphone|ipod|android.*mobile|windows phone)" 1;
}
map "$gl_mobile:$cookie_gl_view:$arg_web" $gl_to_app {
    default 0;
    "1::" 1;
}
map $arg_web $gl_view_cookie {
    default "";
    1 "gl_view=web; Path=/; Max-Age=3600; SameSite=Lax";
}

# (/etc/nginx/sites-available/godlife) HTTPS 인증서 줄은 certbot 이 붙인다
server {
    listen 80;
    server_name 52-79-61-201.sslip.io;

    root /opt/godlife/frontend/dist;
    index index.html;
    client_max_body_size 6m;

    location ~ ^/(api|oauth2|login/oauth2)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /opt/godlife/app/;
        add_header Cache-Control "no-cache" always; # app-no-cache
        try_files $uri $uri/ /app/index.html;
    }

    location = / {
        error_page 418 = @spa;
        return 418;
    }

    location / {
        try_files $uri @spa;
    }

    location @spa {
        if ($gl_to_app) {
            return 302 /app/;
        }
        add_header Set-Cookie $gl_view_cookie;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    server_name 52-79-61-201.sslip.io;


}
}
